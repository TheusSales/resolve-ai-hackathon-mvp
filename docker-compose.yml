services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: resolveai
      POSTGRES_PASSWORD: resolveai
      POSTGRES_DB: resolveai
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432" # 5433 no host para não brigar com um Postgres local na 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolveai"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://resolveai:resolveai@db:5432/resolveai
      JWT_SECRET: chave-super-secreta-trocar-em-producao
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  db_data:
